name: 更新数据

on:
  schedule:
    - cron: "17 */6 * * *" # 每 6 小时一次（UTC）
  workflow_dispatch: # 也可以在 Actions 页面手动运行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成 data.json
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 scripts/build_data.py

      - name: 有变化就提交
        run: |
          if git diff --quiet -- docs/data.json; then
            echo "数据没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "数据更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
